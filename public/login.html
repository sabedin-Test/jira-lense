<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Atlassian Lense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="center">
  <header class="topbar">
    <img class="brand" src="/etihad-logo.svg" alt="Etihad" onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: 'brand-text', textContent: 'ETIHAD' }))">
  </header>
  <main class="login">
    <h1>Atlassian <span>Lense</span></h1>
    <p class="tag">Ask questions about your Jira projects and search your Confluence pages in plain language.</p>
    <a class="btn big" href="/auth/login">Sign in with Atlassian</a>
    <p class="meta">You'll be redirected to Atlassian to approve access. Queries run with your own Jira and Confluence permissions.</p>
  </main>
</body>
</html>
